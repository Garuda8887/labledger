services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        OCR_ENGINE: ${OCR_ENGINE:-tesseract}
    environment:
      LABLEDGER_DATA_DIR: /data
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      APP_PASSPHRASE: ${APP_PASSPHRASE:-}
      SESSION_SECRET: ${SESSION_SECRET:-}   # empty -> generated once, stored in the data volume
      COOKIE_SECURE: ${COOKIE_SECURE:-}     # empty -> Secure when served over HTTPS
      EXTRACTOR_PLUGIN: ${EXTRACTOR_PLUGIN:-}
    volumes:
      - labledger-data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://${BIND_HOST:-127.0.0.1}:8000
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  labledger-data:
    driver: local
